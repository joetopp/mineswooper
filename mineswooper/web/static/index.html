<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minesweeper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The whole page is one fake Windows 95 window: a raised 2px bevel over a #c0c0c0 face. -->
    <div class="window" id="app">
      <div class="title-bar">
        <svg class="title-bar-icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="0" y="0" width="16" height="16" fill="#c0c0c0" />
          <circle cx="8" cy="9" r="4" fill="#000000" />
          <rect x="7" y="2" width="2" height="3" fill="#000000" />
          <rect x="6" y="7" width="2" height="2" fill="#ffffff" />
        </svg>
        <span class="title-bar-text">Minesweeper</span>
        <!-- Chrome only: the real window buttons belong to the browser, so these do nothing. -->
        <span class="title-bar-controls" aria-hidden="true">
          <span class="title-bar-button">
            <svg viewBox="0 0 9 9"><rect x="1" y="6" width="6" height="2" fill="#000000" /></svg>
          </span>
          <span class="title-bar-button">
            <svg viewBox="0 0 9 9">
              <rect x="1" y="1" width="7" height="7" fill="none" stroke="#000000" />
              <rect x="1" y="1" width="7" height="2" fill="#000000" />
            </svg>
          </span>
          <span class="title-bar-button">
            <svg viewBox="0 0 9 9" stroke="#000000" stroke-width="1.2">
              <line x1="1.5" y1="1.5" x2="7.5" y2="7.5" />
              <line x1="7.5" y1="1.5" x2="1.5" y2="7.5" />
            </svg>
          </span>
        </span>
      </div>

      <div class="menu-bar">
        <button
          type="button"
          class="menu-title"
          id="game-menu-button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="game-menu"
        >
          <span class="menu-label">Game</span>
        </button>
        <ul class="menu" id="game-menu" role="menu" hidden>
          <li role="none">
            <button type="button" class="menu-item" role="menuitem" data-difficulty="beginner">
              Beginner
            </button>
          </li>
          <li role="none">
            <button type="button" class="menu-item" role="menuitem" data-difficulty="intermediate">
              Intermediate
            </button>
          </li>
          <li role="none">
            <button type="button" class="menu-item" role="menuitem" data-difficulty="expert">
              Expert
            </button>
          </li>
          <li class="menu-separator" role="none"></li>
          <li role="none">
            <button type="button" class="menu-item" role="menuitem" id="menu-custom">
              Custom...
            </button>
          </li>
        </ul>
      </div>

      <div class="field">
        <div class="scoreboard">
          <div class="led" id="mine-counter" role="img" aria-label="Mines remaining"></div>
          <button type="button" class="face" id="face" aria-label="New game"></button>
          <div class="led" id="timer" role="img" aria-label="Elapsed seconds"></div>
        </div>
        <div class="grid-frame">
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </div>

    <div class="modal" id="custom-modal" hidden>
      <div
        class="window dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="custom-modal-title"
      >
        <div class="title-bar">
          <span class="title-bar-text" id="custom-modal-title">Custom Field</span>
        </div>
        <form class="dialog-body" id="custom-form" novalidate>
          <div class="dialog-fields">
            <label for="custom-rows">Height:</label>
            <input type="number" id="custom-rows" name="rows" value="9" min="1" max="100" />
            <label for="custom-cols">Width:</label>
            <input type="number" id="custom-cols" name="cols" value="9" min="1" max="100" />
            <label for="custom-mines">Mines:</label>
            <input type="number" id="custom-mines" name="mine_count" value="10" min="0" />
          </div>
          <p class="dialog-error" id="custom-error" role="alert" hidden></p>
          <div class="dialog-buttons">
            <button type="submit" class="button" id="custom-ok">OK</button>
            <button type="button" class="button" id="custom-cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

[project]
name = "mineswooper"
version = "0.1.0"
description = "A simple CLI Minesweeper game"
authors = [
    {name = "Joe Topp",email = "joetopp@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[project.scripts]
minesweeper = "mineswooper.minesweeper:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
